name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: 格式门禁
        run: cargo fmt --all --check

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # `xiaoman-ui` and `xiaoman-gpui` need GPUI's desktop stack (X11/Wayland/fontconfig on
      # Linux); the `gpui` job below builds, tests and lints them on a Windows runner. Everything
      # that runs headless is covered here.
      - name: 核心、Web、CLI、iOS runner 测试
        run: cargo test --workspace --exclude xiaoman-ui --exclude xiaoman-gpui --no-fail-fast
      - name: Clippy 门禁
        run: cargo clippy --workspace --exclude xiaoman-ui --exclude xiaoman-gpui --all-targets -- -D warnings

  gpui:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: 桌面 UI 与 Android GPUI 前端的测试
        run: cargo test -p xiaoman-ui -p xiaoman-gpui --no-fail-fast
      - name: 桌面 UI 与 Android GPUI 前端的 Clippy 门禁
        run: cargo clippy -p xiaoman-ui -p xiaoman-gpui --all-targets -- -D warnings

  android-gpui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      # runner 自带的 SDK 已经够用；android-actions/setup-android 会去装已下架的 `tools` 包然后失败。
      - name: 安装 NDK 与平台包
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(ls "$ANDROID_SDK_ROOT"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
      - name: 构建 GPUI Android 前端 release APK
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/27.2.12479018
          XIAOMAN_SIGNING_KEYSTORE_BASE64: ${{ secrets.XIAOMAN_SIGNING_KEYSTORE_BASE64 }}
          XIAOMAN_SIGNING_STORE_PASSWORD: ${{ secrets.XIAOMAN_SIGNING_STORE_PASSWORD }}
          XIAOMAN_SIGNING_KEY_ALIAS: ${{ secrets.XIAOMAN_SIGNING_KEY_ALIAS }}
          XIAOMAN_SIGNING_KEY_PASSWORD: ${{ secrets.XIAOMAN_SIGNING_KEY_PASSWORD }}
        run: ./gradlew -p crates/xiaoman-gpui/android assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: xiaoman-gpui-release-apk
          path: crates/xiaoman-gpui/android/app/build/outputs/apk/release/*.apk
