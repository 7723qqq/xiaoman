[package]
name = "xiaoman-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
xiaoman-api = { path = "../xiaoman-api" }
xiaoman-app = { path = "../xiaoman-app" }
xiaoman-mcp = { path = "../xiaoman-mcp" }
serde_json.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# Both front-ends use the same GPUI line (`gpui-pre`), so the desktop can use `gpui-kit`'s
# input widget — with selection, Ctrl+A, drag and the edit menu — instead of a hand-rolled field.
gpui = { package = "gpui-pre", version = "=0.3.6" }
# Boots the host's windowing and text backends (winit + font-kit on Windows).
gpui-platform = { package = "gpui-pre-platform", version = "=0.3.6" }
gpui-kit = { version = "=0.6.6", default-features = false, features = ["component"] }
