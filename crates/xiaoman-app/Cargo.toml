[package]
name = "xiaoman-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
xiaoman-agent = { path = "../xiaoman-agent" }
xiaoman-api = { path = "../xiaoman-api" }
xiaoman-llm = { path = "../xiaoman-llm" }
xiaoman-mcp = { path = "../xiaoman-mcp" }
xiaoman-memory = { path = "../xiaoman-memory" }
xiaoman-sentinel = { path = "../xiaoman-sentinel" }
xiaoman-skills = { path = "../xiaoman-skills" }
xiaoman-vocab = { path = "../xiaoman-vocab" }
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
wiremock = "0.6"
