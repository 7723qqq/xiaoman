org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=false
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# ---------------------------------------------------------------- rust build knobs
# ABIs to build and package, comma separated: arm64-v8a, armeabi-v7a, x86_64.
# xiaoman.abis=arm64-v8a

# Set to true to assemble a Kotlin-only APK (no libxiaoman_android.so, every native call logs and
# returns false).
# xiaoman.rust.skip=false

# Where cargo writes its artifacts. Defaults to <repo>/target, shared with command line builds.
# xiaoman.cargoTargetDir=/home/me/.cache/xiaoman-cargo-target

# NDK used for the linker when cargo-ndk is not installed. Falls back to ANDROID_NDK_HOME,
# then ANDROID_NDK_ROOT.
# xiaoman.ndkDir=/home/me/Android/Sdk/ndk/27.0.12077973
