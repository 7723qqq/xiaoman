[workspace]
resolver = "3"
members = ["crates/xiaoman-api", "crates/xiaoman-sentinel", "crates/xiaoman-llm", "crates/xiaoman-memory", "crates/xiaoman-skills", "crates/xiaoman-vocab", "crates/xiaoman-agent", "crates/xiaoman-mcp", "crates/xiaoman-web", "crates/xiaoman-ios", "crates/xiaoman-android", "crates/xiaoman-app", "crates/xiaoman-ui", "crates/xiaoman-cli", "crates/xiaoman-gpui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false

[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
async-trait = "0.1.92"
